// AUTO-GENERATED config (smoke test).

topology = mesh;
k        = 4;       // 4 router mỗi chiều -> tổng 16 router
n        = 2;       // 2 chiều -> mesh 2D

routing_function = dor;     // dimension-order routing (baseline đơn giản)
packet_size      = 1;       // 1 flit / packet để dữ liệu time-series mượt

num_vcs     = 4;            // ít VC cho nhẹ
vc_buf_size = 8;            // buffer 8 flit / VC -> tối đa 32 flit/router
wait_for_tail_credit = 1;

vc_allocator = islip;
sw_allocator = islip;
alloc_iters  = 2;

credit_delay   = 2;
routing_delay  = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;

input_speedup    = 1;
output_speedup   = 1;
internal_speedup = 1.0;

sim_type      = latency;
traffic       = uniform;
injection_rate = 0.20;      // mức trung bình, đủ tạo congestion nhẹ
use_read_write = 0;

warmup_periods = 1;         // 1 chu kỳ warm-up cho smoke test
sample_period  = 100;       // dump per-router state mỗi 100 cycle
sim_count      = 8;         // tổng cộng 8 sample period sau warmup

injected_flits_out     = smoke_injected.csv;
ejected_flits_out      = smoke_ejected.csv;
received_flits_out     = smoke_received.csv;
sent_flits_out         = smoke_sent.csv;
stored_flits_out       = smoke_stored.csv;
outstanding_credits_out = smoke_credits.csv;
